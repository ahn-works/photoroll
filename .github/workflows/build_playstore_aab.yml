name: Build Google Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore app/photoroll-release-key.jks \
            -alias photoroll -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass photoroll2026 -keypass photoroll2026 \
            -dname "CN=PhotoRoll, OU=Mobile, O=PhotoRoll, L=Seoul, ST=Seoul, C=KR"

      - name: Build Android App Bundle (AAB) & Release APK
        run: |
          gradle bundleRelease assembleRelease --stacktrace

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRoll-PlayStore-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Test Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRoll-Test-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
