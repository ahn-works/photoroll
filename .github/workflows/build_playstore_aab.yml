name: Build Google Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore app/photoroll-release-key.jks \
            -alias photoroll -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass photoroll2026 -keypass photoroll2026 \
            -dname "CN=PhotoRoll, OU=Mobile, O=PhotoRoll, L=Seoul, ST=Seoul, C=KR"

      - name: Build Android App Bundle (AAB) & Release APK
        run: |
          gradle bundleRelease assembleRelease testReleaseUnitTest --stacktrace

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRoll-PlayStore-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Test Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRoll-Test-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "PhotoRoll Galaxy v1.0.0 (Google Play Production Ready)"
          body: |
            ### 🚀 PhotoRoll Galaxy 프로덕션 배포 번들
            - **Google Play Console 업로드 파일**: `app-release.aab`
            - **기기 직접 설치 테스트 파일**: `app-release.apk`
            
            스토어 제출 서류 및 자산은 저장소 내 `playstore_assets/` 폴더를 참조하세요.
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
